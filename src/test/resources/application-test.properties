# Test Configuration for LLM Gateway
# This file provides mock values for testing environment

############################################################
# LLM Configuration (Test Values)
############################################################
llm.fast_tier.base_url=http://localhost:8080/mock
llm.fast_tier.api.key=test-api-key-for-testing
llm.fast_tier.model=test-model

############################################################
# Gemini Configuration (Test Values)
############################################################
gemini.api.key=test-gemini-key-for-testing

############################################################
# Spring Actuator (Test)
############################################################
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

############################################################
# File Upload (Test)
############################################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

############################################################
# Web Scraper (Test)
############################################################
web.scraper.timeout=5000
web.scraper.userAgent=LLM-Gateway-Test/1.0

############################################################
# Async Timeout (Test)
############################################################
spring.mvc.async.request-timeout=30000

############################################################
# Test-specific Settings
############################################################
spring.main.allow-bean-definition-overriding=true
logging.level.com.example.demo=DEBUG
