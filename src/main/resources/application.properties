############################################################
# Application
############################################################
spring.application.name=demo-for-llm

############################################################
# LLM Configuration
#
# Required Environment Variables:
#
# LLM_BASE_URL
# Example:
# https://models.inference.ai.azure.com/chat/completions
#
# LLM_API_KEY
# Your Azure AI Inference or Groq API key.
#
# LLM_MODEL (Optional)
# Default: gpt-4o-mini
#
# Examples:
# gpt-4o-mini
# llama-3.3-70b-versatile
# llama-3.1-8b-instant
# mixtral-8x7b-32768
############################################################
llm.fast_tier.base_url=https://models.inference.ai.azure.com/chat/completions
llm.fast_tier.api.key=${LLM_API_KEY}
llm.fast_tier.model=${LLM_MODEL:gpt-4o-mini}

############################################################
# Gemini Configuration (Optional)
#
# Set only if you want to use Gemini features.
# Get an API key from:
# https://aistudio.google.com/app/apikey
############################################################
gemini.api.key=${GEMINI_API_KEY:}

############################################################
# Spring Actuator
############################################################
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

############################################################
# File Upload
############################################################
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

############################################################
# Web Scraper
############################################################
web.scraper.timeout=10000
web.scraper.userAgent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36

############################################################
# Async Timeout
############################################################
spring.mvc.async.request-timeout=120000